<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Той чакыруусу</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Marck+Script&display=swap" rel="stylesheet">

<!-- ======================================================================
     СТИЛИ (внешний вид). Цвета можно менять в самом верху, в блоке :root
     ====================================================================== -->
<style>
:root{
  --bg:#fbf8f3;      /* фон страницы */
  --ink:#3b3a36;     /* цвет текста */
  --soft:#6f6a5e;    /* серый текст */
  --gold:#b08d57;    /* золотой акцент */
  --sage:#e3e9dc;    /* светло-зелёный фон блоков */
  --rose:#e9b8c0;    /* цвет лепестков */
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:25px;font-weight:500;line-height:1.5;text-align:center;overflow-x:hidden}
body:not(.open){overflow:hidden;height:100vh}
section{max-width:540px;margin:0 auto;padding:72px 28px;position:relative;z-index:1}
.band{background:var(--sage);max-width:none}
.band>div{max-width:540px;margin:0 auto}
.script{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:400;color:var(--gold)}
h2{font-weight:700;font-size:36px;line-height:1.2;margin:0 0 16px}
.line{width:220px;height:26px;margin:26px auto}.line svg{width:100%;height:100%}
#petals{position:fixed;inset:0;pointer-events:none;z-index:0}

/* --- Конверт (первый экран) --- */
#envelope{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#fff,var(--sage));transition:opacity 1s,transform 1s}
#envelope.gone{opacity:0;transform:scale(1.15);pointer-events:none}
.seal{width:120px;height:120px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;font-size:52px;color:#fff;background:radial-gradient(circle at 35% 30%,#d9a0aa,#a8586a);box-shadow:0 10px 30px rgba(168,88,106,.4);animation:beat 1.8s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.1)}}
.btn{display:inline-block;border:1px solid var(--gold);color:var(--ink);background:none;font-size:23px;padding:13px 32px;border-radius:40px;font:inherit;text-decoration:none;cursor:pointer;margin:6px;position:relative;overflow:hidden;transition:.3s}
.btn:hover,.btn.sel{background:var(--gold);color:#fff}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.5s infinite}
@keyframes shine{60%,100%{left:140%}}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* --- Первый экран с именами --- */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;max-width:none}
.pair{margin:6px 0}
.nm{margin:0;font-weight:400;letter-spacing:.03em;font-size:clamp(60px,19vw,96px);line-height:1.08;filter:drop-shadow(0 2px 6px rgba(120,90,40,.22))}
.nm .ch{background:linear-gradient(120deg,#8a6a2e 0%,#d9b970 40%,#9a7633 70%,#c9a45c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .02em}
.multi .nm{font-size:clamp(50px,15vw,74px)}.nm{white-space:nowrap}
#heroNames{position:relative;width:min(94%,440px);padding:10px 0 20px}
.orn{display:flex;align-items:center;gap:10px;width:150px;margin:18px auto}.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--gold)}.orn i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.hero::before{content:"";position:absolute;width:520px;height:520px;max-width:120vw;border-radius:50%;background:radial-gradient(circle,rgba(233,184,192,.35),transparent 65%);animation:glow 5s ease-in-out infinite;z-index:-1}
@keyframes glow{50%{transform:scale(1.18);opacity:.6}}
.hero{position:relative;overflow:hidden;padding-top:120px;padding-bottom:90px}
.star{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:0;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.9;transform:scale(1.8)}}
.branch{position:absolute;top:-10px;width:105px;opacity:.85;transform-origin:top left;animation:sway 6s ease-in-out infinite}
.branch.l{left:-8px}.branch.r{right:-8px;transform:scaleX(-1);animation-name:swayr}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes swayr{0%,100%{transform:scaleX(-1) rotate(0)}50%{transform:scaleX(-1) rotate(4deg)}}
.big{font-weight:400;letter-spacing:.02em;font-size:clamp(48px,14vw,66px);line-height:1.15;margin:4px 0}
.prog{max-width:420px;margin:26px auto 0;text-align:left;position:relative;padding-left:26px;border-left:2px solid var(--gold)}
.prog div{position:relative;margin-bottom:22px}
.prog div::before{content:"";position:absolute;left:-35px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(176,141,87,.25)}
.prog b{display:block;color:var(--gold);font-size:32px;line-height:1.1}
.hero .amp{font-size:44px;margin:4px 0;opacity:0;transition:opacity 1.5s 1.6s}
.open .hero .amp{opacity:1}
.hero .sub{color:var(--soft);letter-spacing:.1em;opacity:0;transition:opacity 1.5s 2.4s}
.open .hero .sub{opacity:1}
.ch{white-space:pre;display:inline-block;opacity:0;transform:translateY(30px) rotate(-6deg)}
.open .ch{animation:letter .9s forwards}
@keyframes letter{to{opacity:1;transform:none}}
.scrollhint{position:absolute;bottom:28px;color:var(--soft);font-size:20px;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(8px)}}

/* --- Появление блоков при прокрутке --- */
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s,transform 1s}
.rv.in{opacity:1;transform:none}

/* --- Календарь --- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:380px;margin:22px auto 0;font-size:24px}
.cal b{color:var(--soft);font-weight:500;font-size:19px}
.cal span.on{background:var(--gold);color:#fff;border-radius:50%;aspect-ratio:1;display:grid;place-items:center;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(176,141,87,.6)}100%{box-shadow:0 0 0 16px rgba(176,141,87,0)}}

/* --- Форма гостя --- */
input,select{font:inherit;font-size:24px;width:100%;padding:13px 16px;margin:6px 0;border:1px solid var(--soft);border-radius:10px;background:#fff;color:var(--ink)}
#thanks{display:none;font-size:36px;margin-top:14px}

/* --- Таймер --- */
.timer{display:flex;justify-content:center;gap:16px;margin-top:18px}
.timer div{min-width:72px}
.timer strong{display:block;font-size:50px;font-weight:600;color:var(--gold)}
.timer strong.flip{animation:flip .5s}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}}
.timer small{color:var(--soft);font-size:20px}

.rings{width:150px;margin:0 auto 6px;display:block;overflow:visible}
.rings circle{fill:none;stroke:var(--gold);stroke-width:2.6;stroke-dasharray:140;stroke-dashoffset:140;transition:stroke-dashoffset 2.6s ease .3s}
.rings circle+circle{transition-delay:1s}
.in .rings circle{stroke-dashoffset:0}
.rings .gem{fill:#f3e3b8;stroke:var(--gold);stroke-width:1.5;opacity:0;transition:opacity 1s 3s;transform-origin:46px 12px}
.in .rings .gem{opacity:1;animation:gem 2.4s 3.5s infinite}
@keyframes gem{50%{transform:scale(1.35);filter:drop-shadow(0 0 6px #e8c76d)}}
#mbtn,#sbtn{position:fixed;right:12px;bottom:12px;z-index:20;width:48px;height:48px;border-radius:50%;padding:0;background:#fff;font-size:22px;line-height:1}
#sbtn{bottom:68px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ch,.rv,.hero .amp,.hero .sub{opacity:1!important;transform:none!important}}
</style>
</head>

<body>

<!-- ======================================================================
     СТРАНИЦА (структура). Здесь текст править НЕ нужно — всё берётся
     из блока НАСТРОЙКИ ниже в <script>.
     ====================================================================== -->
<canvas id="petals"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="brSvg" fill="none" stroke="#b08d57" stroke-width="1.6" stroke-linecap="round"><path d="M10 0 C30 60 40 120 90 215"/><path d="M26 44 C48 34 62 40 70 56 C50 62 36 56 26 44Z" fill="#dfe8d4"/><path d="M38 86 C62 74 80 80 90 98 C66 106 48 100 38 86Z" fill="#dfe8d4"/><path d="M58 130 C82 116 102 122 112 142 C86 150 68 144 58 130Z" fill="#dfe8d4"/><path d="M22 24 C8 36 10 54 24 62 C36 50 34 34 22 24Z" fill="#efe6cf"/><circle cx="84" cy="188" r="8" fill="#efe6cf"/><circle cx="104" cy="168" r="6" fill="#efe6cf"/></g></defs></svg>

<div id="envelope">
  <div>
    <div class="seal">♥</div>
    <div class="script" style="font-size:48px;line-height:1.2;padding:0 16px" id="introNames"></div>
    <p style="color:var(--soft)">Той чакыруусу</p>
    <button class="btn" id="openBtn">Чакырууну ачуу</button>
  </div>
</div>

<button class="btn" id="mbtn" aria-label="Музыка">♪</button>
<button class="btn" id="sbtn" aria-label="Автопрокрутка">⇣</button>

<section class="hero">
  <svg class="branch l" viewBox="0 0 150 220" aria-hidden="true"><use href="#brSvg"/></svg>
  <svg class="branch r" viewBox="0 0 150 220" aria-hidden="true"><use href="#brSvg"/></svg>
  <div class="script" style="font-size:38px;margin-bottom:26px" id="kicker"></div>
  <div id="heroNames"></div>
  <p class="sub" id="dateShort"></p>
  <div class="scrollhint">өйдө сүрүңүз ↓</div>
</section>

<section class="rv">
  <svg class="rings" viewBox="0 0 120 56" aria-hidden="true"><circle cx="46" cy="34" r="22"/><circle cx="74" cy="34" r="22"/><path class="gem" d="M46 2 L52 8 L46 14 L40 8Z"/></svg>
  <p id="greet"></p>
  <div class="line"></div>
  <div id="namesBlock"></div>
  <p id="intro"></p>
  <div class="line"></div>
  <p><i>Той ээлери:</i></p>
  <h2 id="hosts"></h2>
</section>

<section class="band rv"><div>
  <h2>Той салтанаты</h2>
  <p id="dateLong"></p>
  <div id="monthName" class="script" style="font-size:46px"></div>
  <div class="cal" id="cal"></div>
</div></section>

<section class="rv">
  <h2>Той программасы</h2>
  <div class="prog" id="prog"></div>
</section>

<section class="band rv"><div>
  <h2>Тойдун дареги</h2>
  <p id="venue"></p>
  <a class="btn" id="map" target="_blank" rel="noopener">Картаны ачуу</a>
</div></section>

<section class="rv"><div>
  <h2>Конок анкетасы</h2>
  <p>Тойго катышууңузду алдын ала ырастап коюуңузду өтүнөбүз</p>
  <input id="guest" placeholder="Аты-жөнүңүз" aria-label="Аты-жөнүңүз">
  <select id="count" aria-label="Канча адам">
    <option value="1">1 адам</option><option value="2">2 адам</option><option value="3">3 адам</option>
    <option value="4">4 адам</option><option value="5">5 адам</option><option value="6">6 адам</option>
  </select>
  <div>
    <button class="btn sel" data-v="Келем">Ооба, келем</button>
    <button class="btn" data-v="Келбейм">Тилекке каршы, келе албайм</button>
  </div>
  <button class="btn" id="send">Жоопту жөнөтүү</button>
  <div id="thanks" class="script">Рахмат! Жообуңуз кабыл алынды ♥</div>
</div></section>

<section class="rv">
  <h2>Кубанычыбызга ортоктош болуңуздар!</h2>
  <p>Тойго чейин:</p>
  <div class="timer" id="timer"></div>
</section>


<script>
/* ======================================================================
   1. НАСТРОЙКИ — ТОЛЬКО ЭТОТ БЛОК НУЖНО РЕДАКТИРОВАТЬ
   Меняйте только то, что внутри кавычек "...". Кавычки и запятые не трогайте.
   ====================================================================== */
const CONFIG = {

  /* --- Имена --- */
  /* Пары. Если свадьба одной пары — оставьте одну строку { ... }.
     Если пар две — две строки (как сейчас). Можно добавить и третью.     */
  couples: [
    { groom: "Асан",bride: "Айназик" },
    { groom: "Үсөн", bride: "Гүлнур" }
  ],
  hosts: "Азимбек & Гулбахар",              // той ээлери (хозяева тоя)

  /* --- Дата и время ---
     Формат: ГГГГ-ММ-ДДTЧЧ:ММ  (T между датой и временем оставить!)
     Сейчас стоит 14 ноября 2026, 17:00. Время поменяйте на своё,
     например 18:30 → "2026-11-14T18:30"                                   */
  date: "2026-11-14T17:00",

  /* --- Место --- */
  venue: "Ош шаары,Хан Ордо, дарек",
  mapUrl: "https://go.2gis.com/uutid",        // ссылка на карту (скопируйте из 2GIS или Google Maps)

  /* --- Программа тоя (время и названия можно менять; строки можно удалять/добавлять) --- */
  program: [
    { time: "17:00", title: "Конокторду тосуп алуу" },
    { time: "18:00", title: "Той салтанатынын башталышы" },
    { time: "19:30", title: "Дасторкон жана тилектер" },
    { time: "21:00", title: "Бий жана майрамдык оюн-зоок" }
  ],

  /* --- Тексты (можно оставить как есть) --- */
  greet: "Урматтуу биздин сыйлуу коногубуз!",
  intro: "Сиздерди балдарыбыздын үйлөнүү тоюна күбө болуп, ак баталарыңызды берип, кадырлуу коногубуз болуп кетүүгө чакырабыз!",

  /* --- Куда приходят ответы гостей ---
     Способ А (самый простой): WhatsApp. Впишите свой номер БЕЗ плюса,
       например "996555123456". Ответ гостя придёт вам в WhatsApp.
     Способ Б (таблица для рассадки столиков): Google Таблица.
       Инструкция в файле google-sheet-script.txt, ссылку вставьте сюда.
     Можно использовать оба способа сразу.                                  */
  whatsapp: "996000000000",
  sheetUrl: "https://script.google.com/macros/s/AKfycbxMfHRWkFi0QFup8BQrrMHaFV9c9-r0Sr-XrV1qnpt7yxEWjqAX_3Sz8z4hOhVudYH6/exec",

  /* --- Музыка ---
     "" = встроенная нежная мелодия (создаётся самой страницей).
     Если хотите свою песню: положите mp3 рядом с файлом и впишите
     название, например "song.mp3"                                          */
  musicFile: "The_Piano_Guys_-_A_Thousand_Years_48078419.mp3",

  /* --- Автопрокрутка (страница сама медленно листается вниз) ---
     autoScroll: true = включена, false = выключена
     scrollSpeed: скорость, пикселей в секунду. Меньше число = медленнее.
       20 = очень медленно, 30 = спокойно, 60 = быстрее.
     Гость может остановить её, просто коснувшись экрана.             */
  autoScroll: true,
  scrollSpeed: 30
};


/* ======================================================================
   2. ДАЛЬШЕ ПРОГРАММНЫЙ КОД — ЕГО МЕНЯТЬ НЕ НУЖНО
   ====================================================================== */
const $ = id => document.getElementById(id);
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const DAYS = ["дш","шш","шр","бш","жм","иш","жк"];

/* ---- Заполнение страницы данными ---- */
function fill(){
  const c = CONFIG, d = new Date(c.date), hm = d.toTimeString().slice(0,5);
  const pairs = c.couples.map(p => p.groom + " & " + p.bride);
  document.title = pairs.join(" · ");
  $("introNames").innerHTML = pairs.join('<br><span style="font-size:.6em">✦</span><br>');
  $("kicker").textContent = "Үйлөнүү тоюна чакыруу";
  $("dateShort").textContent = d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"}) + " · " + hm;
  $("greet").textContent = c.greet;
  $("intro").textContent = c.intro;
  $("hosts").textContent = c.hosts;
  $("dateLong").textContent = d.getFullYear() + "-жылдын " + d.getDate() + "-" + MONTHS[d.getMonth()] + "ында, саат " + hm + "де башталат";
  $("venue").textContent = c.venue;
  $("map").href = c.mapUrl;
  $("monthName").textContent = MONTHS[d.getMonth()];
  const first = (new Date(d.getFullYear(), d.getMonth(), 1).getDay() + 6) % 7;
  const total = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  let h = DAYS.map(x => "<b>" + x + "</b>").join("") + "<i></i>".repeat(first);
  for (let i = 1; i <= total; i++) h += i === d.getDate() ? '<span class="on">' + i + "</span>" : "<span>" + i + "</span>";
  $("cal").innerHTML = h;
  // имена: крупно, по буквам
  const hn = $("heroNames"); hn.innerHTML = ""; hn.classList.toggle("multi", c.couples.length > 1);
  let delay = 0.5;
  const word = (text) => {
    const h = document.createElement("div"); h.className = "script nm";
    [...text].forEach(ch => { const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = ch; sp.style.animationDelay = (delay += 0.09) + "s"; h.append(sp); });
    return h;
  };
  c.couples.forEach((p, i) => {
    if (i) hn.insertAdjacentHTML("beforeend", '<div class="orn"><i></i></div>');
    const box = document.createElement("div"); box.className = "pair";
    box.append(word(p.groom)); box.insertAdjacentHTML("beforeend", '<div class="amp script">&amp;</div>'); box.append(word(p.bride));
    hn.append(box); delay += 0.3;
  });
  $("namesBlock").innerHTML = c.couples.map(p => '<div class="script big">' + p.groom + " &amp; " + p.bride + "</div>").join('<div class="line"></div>');
  // программа
  $("prog").innerHTML = c.program.map(x => "<div><b>" + x.time + "</b>" + x.title + "</div>").join("");
  // украшения: цветочные разделители и мерцающие звёзды
  const FL = '<svg viewBox="0 0 220 26"><g stroke="#b08d57" fill="none" stroke-width="1.2" stroke-linecap="round"><path d="M6 13H88M132 13H214"/><path d="M96 13c6-9 12-9 14 0 2-9 8-9 14 0-6 9-12 9-14 0-2 9-8 9-14 0z" fill="#efe6cf" stroke="#b08d57"/></g><circle cx="92" cy="13" r="2" fill="#b08d57"/><circle cx="128" cy="13" r="2" fill="#b08d57"/></svg>';
  document.querySelectorAll(".line").forEach(el => el.innerHTML = FL);
  const hero = document.querySelector(".hero");
  for (let i = 0; i < 16; i++) { const st = document.createElement("i"); st.className = "star"; st.style.cssText = "left:" + Math.random()*96 + "%;top:" + Math.random()*96 + "%;animation-delay:" + Math.random()*3 + "s"; hero.append(st); }
}

/* ---- Таймер ---- */
let last = [];
function tick(){
  const s = Math.max(0, Math.floor((new Date(CONFIG.date) - Date.now()) / 1000));
  const v = [[Math.floor(s/86400),"күн"],[Math.floor(s%86400/3600),"саат"],[Math.floor(s%3600/60),"мүнөт"],[s%60,"секунд"]];
  $("timer").innerHTML = v.map((x, i) => "<div><strong" + (last[i] !== x[0] ? ' class="flip"' : "") + ">" + String(x[0]).padStart(2,"0") + "</strong><small>" + x[1] + "</small></div>").join("");
  last = v.map(x => x[0]);
}

/* ---- Лепестки ---- */
(function petals(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const cv = $("petals"), cx = cv.getContext("2d");
  const rose = getComputedStyle(document.documentElement).getPropertyValue("--rose").trim();
  let W, H, P = [];
  const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  size(); addEventListener("resize", size);
  for (let i = 0; i < 28; i++) P.push({x: Math.random()*W, y: Math.random()*H, r: 5 + Math.random()*7, v: .4 + Math.random()*.8, a: Math.random()*6, w: .01 + Math.random()*.02});
  (function loop(){
    cx.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.y += p.v; p.a += p.w; p.x += Math.sin(p.a) * .7;
      if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a);
      cx.globalAlpha = .55; cx.fillStyle = rose;
      cx.beginPath(); cx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.3); cx.fill(); cx.restore();
    });
    requestAnimationFrame(loop);
  })();
})();

/* ---- Появление блоков при прокрутке ---- */
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add("in")), {threshold: .15});
document.querySelectorAll(".rv").forEach(el => io.observe(el));

/* ---- Музыка: встроенная мелодия (канон в ре мажоре, создаётся кодом) ---- */
const Music = (() => {
  let ac, master, timer, step = 0, nextT = 0, playing = false, audio = null;
  const f = m => 440 * Math.pow(2, (m - 69) / 12);
  const BEAT = 0.42; // скорость: больше число = медленнее
  // аккорды: бас + 4 ноты арпеджио + нота мелодии
  const CH = [[50,[62,66,69,74],78],[45,[64,69,73,76],76],[47,[62,66,71,74],74],[42,[61,66,69,73],73],
              [43,[62,67,71,74],71],[50,[62,66,69,74],69],[43,[62,67,71,74],71],[45,[64,69,73,76],73]];
  const PAT = [0,1,2,3,2,1,2,1];
  function note(m, t, dur, vol, type){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
  }
  function schedule(){
    while (nextT < ac.currentTime + .6) {
      const c = CH[Math.floor(step / 8) % CH.length], i = step % 8;
      note(c[1][PAT[i]], nextT, 1.4, .13, "triangle");        // арпеджио
      if (i === 0) { note(c[0], nextT, 3, .2, "sine"); note(c[2], nextT, 3.2, .1, "sine"); } // бас + мелодия
      nextT += BEAT; step++;
    }
  }
  function build(){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .55;
    const dl = ac.createDelay(); dl.delayTime.value = .32;       // лёгкое эхо
    const fb = ac.createGain(); fb.gain.value = .35;
    dl.connect(fb).connect(dl); master.connect(dl); dl.connect(ac.destination); master.connect(ac.destination);
  }
  return {
    start(){
      if (CONFIG.musicFile) { audio = audio || Object.assign(new Audio(CONFIG.musicFile), {loop: true}); audio.play(); playing = true; return; }
      if (!ac) build();
      ac.resume(); nextT = ac.currentTime + .1; schedule();
      timer = setInterval(schedule, 200); playing = true;
    },
    stop(){ if (audio) audio.pause(); if (ac) { ac.suspend(); clearInterval(timer); } playing = false; },
    toggle(){ playing ? this.stop() : this.start(); $("mbtn").style.opacity = playing ? 1 : .5; }
  };
})();
$("mbtn").onclick = () => Music.toggle();

/* ---- Салют из золотых блёсток ---- */
function burst(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:fixed;inset:0;z-index:60;pointer-events:none";
  document.body.append(cv);
  const W = cv.width = innerWidth, H = cv.height = innerHeight, cx = cv.getContext("2d");
  const cols = ["#d9b970","#b08d57","#e9b8c0","#fff3d6"];
  const P = Array.from({length: 110}, () => ({x: W/2, y: H*.5, vx: (Math.random()-.5)*15, vy: -Math.random()*15 - 3, r: 2 + Math.random()*3.5, c: cols[Math.random()*4|0], a: 1, rot: Math.random()*6}));
  let f = 0;
  (function loop(){
    cx.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.vy += .27; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.a -= .007; p.rot += .12;
      if (p.a <= 0) return;
      cx.globalAlpha = p.a; cx.fillStyle = p.c; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillRect(-p.r, -p.r/2, p.r*2, p.r); cx.restore();
    });
    if (++f < 170) requestAnimationFrame(loop); else cv.remove();
  })();
}

/* ---- Автопрокрутка ---- */
const Auto = (() => {
  let on = false, y = 0, t0 = 0, raf = 0;
  const maxY = () => document.documentElement.scrollHeight - innerHeight;
  function frame(t){
    if (!on) return;
    y += (t - t0) / 1000 * CONFIG.scrollSpeed; t0 = t;
    window.scrollTo({top: y, behavior: "instant"});
    if (y >= maxY()) return stop();
    raf = requestAnimationFrame(frame);
  }
  function start(){ if (on) return; on = true; y = window.scrollY; t0 = performance.now(); $("sbtn").textContent = "⏸"; raf = requestAnimationFrame(frame); }
  function stop(){ on = false; cancelAnimationFrame(raf); $("sbtn").textContent = "⇣"; }
  // любое касание, колесо или клавиша — останавливают прокрутку
  ["wheel","touchstart","mousedown","keydown"].forEach(ev => addEventListener(ev, e => { if (on && e.target.id !== "sbtn") stop(); }, {passive: true}));
  $("sbtn").onclick = () => on ? stop() : (y >= maxY() && window.scrollTo({top: 0, behavior: "instant"}), start());
  return {start, stop};
})();

/* ---- Открытие конверта ---- */
$("openBtn").onclick = () => {
  $("envelope").classList.add("gone");
  document.body.classList.add("open");
  Music.start();
  burst();
  if (CONFIG.autoScroll) setTimeout(() => Auto.start(), 6500);   // начнёт после появления имён
};

/* ---- Анкета гостя ---- */
let answer = "Келем";
document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
  answer = b.dataset.v;
  document.querySelectorAll("[data-v]").forEach(x => x.classList.toggle("sel", x === b));
});
$("send").onclick = () => {
  const name = $("guest").value.trim();
  if (!name) { $("guest").focus(); $("guest").placeholder = "Алгач атыңызды жазыңыз"; return; }
  const count = $("count").value;
  if (CONFIG.sheetUrl) {   // запись в Google Таблицу
    fetch(CONFIG.sheetUrl, {method: "POST", mode: "no-cors", body: JSON.stringify({name, answer, count})}).catch(() => {});
  }
  if (CONFIG.whatsapp && CONFIG.whatsapp !== "996000000000") {   // сообщение в WhatsApp
    const txt = name + " — " + answer + (answer === "Келем" ? " (" + count + " адам)" : "");
    window.open("https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(txt), "_blank");
  }
  $("thanks").style.display = "block";
  $("send").style.display = "none";
};

fill(); tick(); setInterval(tick, 1000);
